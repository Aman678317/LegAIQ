<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<h2>Generate PWA Icons</h2>
<p>Click each button to download the icon</p>
<div id="icons"></div>

<script>
const sizes = [16, 32, 72, 96, 128, 144, 152, 192, 384, 512];

const svgIcon = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>
  <path d="M50 20 L50 80 M20 50 L80 50" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <circle cx="50" cy="50" r="12" fill="white" opacity="0.2"/>
</svg>`;

const container = document.getElementById('icons');
sizes.forEach(size => {
  const div = document.createElement('div');
  div.style.margin = '10px 0';
  div.innerHTML = `
    <span style="display:inline-block;width:100px;">${size}x${size}:</span>
    <canvas id="canvas-${size}" width="${size}" height="${size}" style="border:1px solid #ccc;vertical-align:middle;"></canvas>
    <button onclick="downloadIcon(${size})" style="margin-left:10px;">Download PNG</button>
  `;
  container.appendChild(div);

  // Draw on canvas
  const canvas = document.getElementById(`canvas-${size}`);
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = function() {
    ctx.drawImage(img, 0, 0, size, size);
  };
  img.src = 'data:image/svg+xml;base64,' + btoa(svgIcon(size));
});

function downloadIcon(size) {
  const canvas = document.getElementById(`canvas-${size}`);
  const link = document.createElement('a');
  link.download = `icon-${size}x${size}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
